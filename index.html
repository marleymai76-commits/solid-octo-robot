<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMR Montagem de Móveis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #1a1a1a; color: white; }
        
        /* Cabeçalho */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid #333; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 30px; }
        nav ul li a { text-decoration: none; color: #ccc; font-size: 14px; text-transform: uppercase; }
        nav ul li a.active { color: #c5a059; }

        /* Hero Section */
        .hero { display: flex; align-items: center; padding: 80px 5%; min-height: 80vh; }
        .hero-content { flex: 1; padding-right: 50px; }
        .hero-content h1 { font-size: 48px; line-height: 1.2; margin-bottom: 20px; }
        .hero-content h1 span { color: #c5a059; }
        .hero-content p { color: #bbb; margin-bottom: 30px; font-size: 18px; }
        
        .btn { 
            background-color: #8b6b32; color: white; padding: 15px 30px; 
            text-decoration: none; border-radius: 5px; font-weight: bold;
            display: inline-flex; align-items: center;
        }
        
        .hero-image { flex: 1; }
        .hero-image img { width: 100%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; }
            .hero-content { padding-right: 0; margin-bottom: 40px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">JMR <small style="display:block; font-size: 10px; letter-spacing: 1px;">MONTAGEM DE MÓVEIS</small></div>
    <nav>
        <ul>
            <li><a href="#" class="active">INÍCIO</a></li>
            <li><a href="#">SOBRE</a></li>
            <li><a href="#">SERVIÇOS</a></li>
            <li><a href="#">DICAS</a></li>
            <li><a href="#">CONTATO</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>Montagem com <span>precisão.</span><br>Resultado que você vê.</h1>
        <p>Profissionais qualificados para montar seus móveis com segurança e qualidade.</p>
        <a href="#" class="btn">SOLICITE UM ORÇAMENTO 💬</a>
    </div>
    <div class="hero-image">
        <img src="https://via.placeholder.com/600x400" alt="Móvel montado">
    </div>
</section>

</body>
</html>
